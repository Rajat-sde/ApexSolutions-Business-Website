<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexSolutions - Contact Us</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation Header -->
    <header class="navbar">
        <div class="logo">ApexSolutions</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <!-- Contact Form Section -->
    <section class="content-section">
        <h1>Get in Touch</h1>
        <p>Have a project in mind? Fill out the form below and our team will get back to you shortly.</p>
        
        <form id="contact-form" class="contact-form">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" required placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" rows="4" required placeholder="Write your message..."></textarea>
            </div>
            <button type="submit" class="btn primary-btn">Send Message</button>
        </form>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 ApexSolutions. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
